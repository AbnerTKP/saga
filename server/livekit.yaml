# LiveKit para até ~10 amigos num VPS pequeno.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  # gere um par novo com:  docker run --rm livekit/livekit-server generate-keys
  # e coloque o mesmo par no .env do servidor de token
  APIxxxxxxxx: segredo-longo
turn:
  enabled: true
  domain: turn.SEUDOMINIO.com.br
  udp_port: 3478
  relay_range_start: 40000
  relay_range_end: 40100
  tls_port: 5349
  # Se tiver certificado (ver README), descomente:
  # cert_file: /certs/turn.crt
  # key_file: /certs/turn.key
room:
  auto_create: true
  empty_timeout: 120
  max_participants: 20
# Quem decide "está falando" é o servidor, e o padrão dele demora meio segundo — medido
# aqui, com dois participantes reais na produção: 305, 410, 487, 516 e 595 ms, mediana
# 487. O padrão é medir de 400 em 400 ms e suavizar por 4 medições, o que é feito para
# uma sala de reunião com muita gente; para cinco amigos, meio segundo é o anel do avatar
# acendendo depois da frase. Medindo de 150 em 150 e suavizando por 2, a janela cai para
# ~300 ms sem piscar a cada sílaba.
audio:
  update_interval: 150
  smooth_intervals: 2
logging:
  level: info
