# LiveKit para até ~10 amigos num VPS pequeno.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  # gere um par novo com:  docker run --rm livekit/livekit-server generate-keys
  # e coloque o mesmo par no .env do servidor de token
  APIxxxxxxxx: segredo-longo
turn:
  enabled: true
  domain: turn.SEUDOMINIO.com.br
  udp_port: 3478
  relay_range_start: 40000
  relay_range_end: 40100
  tls_port: 5349
  # Se tiver certificado (ver README), descomente:
  # cert_file: /certs/turn.crt
  # key_file: /certs/turn.key
room:
  auto_create: true
  empty_timeout: 120
  max_participants: 20
logging:
  # `info` grava UMA LINHA POR CHAMADA DE API. Com o app pesquisando de 4 em 4 segundos
  # por pessoa, isso encheu 299 MB de log — e cada linha é uma escrita em disco, numa VPS
  # de um núcleo que já passava metade do tempo esperando o disco. O que interessa quando
  # algo dá errado é aviso e erro, e esses continuam.
  level: warn
