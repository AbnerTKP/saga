# Versão sem domínio: só LiveKit + servidor de token, acessados pelo IP.
services:
  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  token:
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
