# Versão sem domínio: só LiveKit + servidor de token, acessados pelo IP.
services:
  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    # A máquina tem 1 núcleo e ~4 GB, e já travou inteira por pressão de memória: o
    # kernel respondia ping e nada mais conseguia rodar, nem o sshd. Com teto, quem
    # estourar morre sozinho e volta pelo `restart` — em vez de levar o resto junto.
    mem_limit: 1500m
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # Sem isto o log cresce para sempre: o do LiveKit chegou a 299 MB registrando UMA
    # LINHA POR CHAMADA DE API. Cada linha é escrita em disco, e a VPS tem um núcleo só.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  token:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    # As contas moram aqui. Sem este volume elas sumiriam a cada atualização do servidor.
    volumes:
      - ./dados:/dados
    environment:
      BANCO: /dados/cantinho.db
    network_mode: host
    # Sem isto o log cresce para sempre: o do LiveKit chegou a 299 MB registrando UMA
    # LINHA POR CHAMADA DE API. Cada linha é escrita em disco, e a VPS tem um núcleo só.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # HTTPS na 443, com certificado da Let's Encrypt para o próprio IP — ver Caddyfile.ip. Na
  # frente dos dois de cima: /rtc vai para o LiveKit, o resto para a Saga. As portas antigas
  # (:3001 e :7880) continuam para o app até a v0.65, que fala HTTP puro.
  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    # Proxy pequeno; o teto é o mesmo motivo dos outros (a VPS de um núcleo que já travou).
    mem_limit: 128m
    network_mode: host
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      # O certificado e a conta da Let's Encrypt. Sem guardar, cada reinício pediria um
      # certificado novo — e a Let's Encrypt limita quantos o mesmo IP pode pedir.
      - ./caddy-dados:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
