# Gera os instaladores de Windows e Mac e publica num GitHub Release.
# Como usar: mude a versão em app/package.json, faça commit e crie a tag:
#   git tag v0.2.0 && git push --tags
# Em ~10 min o Release aparece com o .exe, o .dmg e o latest.yml (usado pela atualização automática).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Barreira: se os testes ou o typecheck falharem, nenhum instalador é gerado.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter app typecheck

  # Cria o Release vazio antes de qualquer build. Sem isto, o electron-builder sobe os
  # arquivos em paralelo e cada upload que não acha um Release existente cria um novo —
  # o resultado são dois Releases com os arquivos divididos entre eles. Com o Release já
  # pronto, todos os uploads (dos dois sistemas) caem no mesmo lugar.
  criar-release:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTAS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTAS: |
            **Windows:** baixe o arquivo `.exe`. O Windows vai avisar "Windows protegeu o seu PC" —
            clique em **Mais informações › Executar mesmo assim**. É só porque o app não tem
            certificado pago; não há nada de errado com ele.

            **Mac:** baixe o `.dmg` e arraste para Aplicativos. Na primeira vez, abra pelo menu
            **Ajustes do Sistema › Privacidade e Segurança › Abrir Mesmo Assim**.

            Ao abrir, o endereço do servidor já vem preenchido: basta a senha do grupo e o seu nome.

  build:
    needs: criar-release
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
    runs-on: ${{ matrix.os }}
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_SENHA: ${{ secrets.MAC_CERT_SENHA }}
      # Nome comum do certificado, igual ao usado para gerá-lo. Não é segredo, e é o erro
      # mais fácil de cometer: se não bater com o do chaveiro, o codesign não acha a
      # identidade. Ver README para gerar o certificado e guardar o .p12 nos secrets.
      #
      # Continua "Cantinho do Vorcaro" DE PROPÓSITO, mesmo o app se chamando Saga: este é
      # o nome dentro do .p12 que está no secret, não o nome do app. Trocar aqui sem gerar
      # um certificado novo faz o codesign não achar a identidade e cair no ad-hoc — e o
      # ad-hoc é justamente o que fazia a permissão de tela cair a cada versão.
      MAC_CERT_NOME: "Cantinho do Vorcaro"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Identidade de código estável para o Mac.
      #
      # Sem isto o afterPack assina em ad-hoc, e aí o "requisito designado" do app é o
      # hash do build — muda a cada versão, e o macOS passa a ver um aplicativo diferente:
      # a permissão de Gravação de Tela que o amigo concedeu deixa de valer, com a chave
      # continuando ligada nos Ajustes. Medido: em ad-hoc o build seguinte não satisfaz o
      # requisito do anterior; com um certificado fixo, satisfaz.
      #
      # O certificado é auto-assinado, gerado uma vez e guardado em secret. Não é da Apple
      # e não tira o aviso do Gatekeeper — isso continua igual. O que ele resolve é a
      # permissão cair a cada versão. Se os secrets não existirem, o passo é pulado e o
      # build sai em ad-hoc como antes, em vez de quebrar.
      - name: Certificado do Mac
        # O segredo precisa estar no `env` do JOB (mais acima) e não só aqui: o `env` de um
        # passo não é visível na condição desse mesmo passo.
        if: matrix.os == 'macos-latest' && env.MAC_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/assinatura.keychain-db"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$MAC_CERT_SENHA" "$KC"
          security unlock-keychain -p "$MAC_CERT_SENHA" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$MAC_CERT_SENHA" -T /usr/bin/codesign -f pkcs12
          # Sem isto o codesign trava pedindo a senha do chaveiro, e no CI não há quem digite.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CERT_SENHA" "$KC"
          # A flag --keychain do codesign não basta: o chaveiro precisa estar na lista de busca.
          security list-keychains -d user -s $(security list-keychains -d user | tr -d ' "') "$KC"
          rm -f "$RUNNER_TEMP/id.p12"
          # É daqui que o afterPack lê a identidade. Sem estas duas linhas ele cai no ad-hoc.
          echo "MAC_SIGN_IDENTITY=$MAC_CERT_NOME" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - run: pnpm --filter app ${{ matrix.cmd }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Continua sem certificado da Apple: quem assina é o afterPack, com o certificado
          # próprio acima quando ele existe, e em ad-hoc quando não existe.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
