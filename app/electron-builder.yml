appId: br.com.vorcaro.cantinho
productName: Saga
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true

# Assina o app em ad-hoc depois de empacotar. Sem isso o macOS não tem identidade de
# código para o app e as permissões de microfone, câmera e tela não ficam guardadas.
afterPack: ./build/afterPack.js

# Onde os instaladores são publicados (GitHub Releases). Mesmo repositório de src/main/update.ts.
publish:
  provider: github
  owner: AbnerTKP
  repo: saga
  # Sem isto o Release nasce como rascunho, visível só para o dono do repositório:
  # o link /releases/latest daria 404 para quem fosse baixar.
  releaseType: release

# Sem assinatura: é só entre amigos. Ver README para abrir no Mac e no Windows.
mac:
  target:
    - { target: dmg, arch: [universal] }
  category: public.app-category.social-networking
  identity: null            # sem certificado da Apple; quem assina (ad-hoc) é o afterPack
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: "Para falar nas salas de voz."
    NSCameraUsageDescription: "Para ligar a webcam."
    # Desde o macOS 14.4 o som do sistema é uma permissão à parte da tela — o Chromium
    # captura por "audio tap" do CoreAudio, com TCC próprio. A chave em si NÃO estava
    # faltando: o Electron já a traz, e o app instalado já a tinha. O que estava faltando
    # era ela estar em português: é esta frase que o macOS mostra na hora de pedir, e o
    # padrão do Electron é "This app needs access to audio capture".
    NSAudioCaptureUsageDescription: "Para levar o som do que você compartilha junto com a imagem."
dmg:
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }

win:
  target:
    - { target: nsis, arch: [x64] }
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true

# Pacote da Microsoft Store. NÃO entra no `win.target`: o .exe do GitHub continua sendo o
# canal de sempre (e o dos consertos urgentes, que na Store esperam a revisão). Quem o
# monta é o `dist:loja`, só no Windows — o makeappx não existe no Mac.
#
# Os três valores de identidade são os que o Partner Center mostra em "Identidade do
# produto" para o "Saga Chat" (Store ID 9NTFHT718FJT). Têm de bater letra por letra, senão
# a Store recusa o envio. "Saga" sozinho já era de outro app na Store.
#
# Vai sem assinatura de propósito: quem assina o pacote é a própria Microsoft, depois da
# revisão — e é essa assinatura que tira o "Windows protegeu o seu PC".
appx:
  identityName: TKPNerelle.SagaChat
  publisher: CN=8DD5962A-BA4B-4003-84A9-4DC9548B9E21
  publisherDisplayName: TKPNerelle
  displayName: Saga Chat
  applicationId: Saga
  # A ficha da loja só pode ser escrita nos idiomas que o pacote declara.
  languages: [pt-BR]
  backgroundColor: transparent
  # Microfone e câmera precisam estar declarados no pacote para o Windows deixar a Saga
  # pedi-los; o runFullTrust é obrigatório em app Electron.
  capabilities: [runFullTrust, internetClient, microphone, webcam]
  # Sem a tarefa de arranque: ver "Abrir junto com o Windows" em src/main/CLAUDE.md.
  addAutoLaunchExtension: false

toolsets:
  nsis: "1.2.1"
